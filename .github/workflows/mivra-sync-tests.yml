name: Mivra sync tests

on:
  push:
    branches: [main]
    paths:
      - 'src/mivra/sync.py'
      - 'tests/test_sync.py'
      - '.github/workflows/mivra-sync-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/mivra/sync.py'
      - 'tests/test_sync.py'
      - '.github/workflows/mivra-sync-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline sync tests
        run: python -m unittest tests.test_sync -v
